<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sobra – Dry Days</title>
<style>:root{--bg:#F2F3F5;--card:#FFFFFF;--tx:#0E0F11;--mut:#5C6166;--line:#DDE0E3;--acc:#1F9E62}
@media (prefers-color-scheme: dark){:root{--bg:#0E0F11;--card:#1C1E22;--tx:#F2F3F5;--mut:#9BA1A6;--line:#33363C;--acc:#3DD68C}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:680px;margin:0 auto;padding:40px 16px 64px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}
.brand{font-weight:700;font-size:17px;color:var(--tx);text-decoration:none;display:flex;align-items:center;gap:10px}
.dot{width:14px;height:14px;border-radius:5px;background:var(--acc)}
nav a{color:var(--mut);text-decoration:none;font-size:15px;margin-left:14px}nav a[aria-current]{color:var(--tx);font-weight:600}
h1{font-size:32px;line-height:1.15;letter-spacing:-.4px;margin:0 0 8px}
h2{font-size:19px;margin:32px 0 8px;letter-spacing:-.2px}
p{margin:0 0 12px}.mut{color:var(--mut)}
.card{background:var(--card);border-radius:20px;padding:20px;margin:20px 0}
.card .lab{font-size:13px;font-weight:600;letter-spacing:1.2px;color:var(--mut);margin-bottom:10px}
ul.pts{list-style:none;margin:0;padding:0}ul.pts li{display:flex;gap:12px;margin:8px 0}
ul.pts li::before{content:"";flex:0 0 10px;height:10px;border-radius:4px;background:var(--acc);margin-top:8px}
a{color:var(--acc)}footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--mut)}</style>
</head>
<body>
<main>
<header><a class="brand" href="./"><span class="dot" aria-hidden="true"></span>Sobra</a>
<nav><a href="datenschutz/">Datenschutz</a><a href="support/">Support</a><a href="privacy/">English</a></nav></header>
<h1>Sobra – Dry Days</h1>
<p class="mut">Deine Tage in Grün, Orange und Rot. Privat auf deinem iPhone.</p>
<div class="card"><ul class="pts"><li><a href="datenschutz/">Datenschutz</a></li><li><a href="privacy/">Privacy Policy (English)</a></li><li><a href="support/">Support</a></li></ul></div>
<footer>Sobra – Dry Days · <a href="mailto:sobra.support@icloud.com">sobra.support@icloud.com</a></footer>
</main>
</body>
</html>
